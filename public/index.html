<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alcance_</title>
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra de marca, franja de resumen, repos, lista a la izquierda y ficha del ítem a la derecha. Marca JOTAPOL. */
:root {
  --tinta: #0E0B2A; --indigo: #3B2FD6; --indigo-2: #4B40E0; --menta: #5EEAD4; --niebla: #DCD8FF; --lavanda: #F4F3FF;
  --postit: #FFE066; --coral: #FF6B5B; --papel: #F7F1E3; --naranja: #E4572E;
  --bg: var(--lavanda); --surface: #FFFFFF; --surface-2: #ECEAFF; --fg: var(--tinta); --muted: #5B5875; --line: var(--niebla);
  --warn: var(--naranja); --code: var(--indigo); --listo-bg: var(--tinta);
  --display: "Bricolage Grotesque", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B0A1F; --surface: #13112E; --surface-2: #1C1946; --fg: #E9E7F7; --muted: #A7A3C4; --line: #2A2752; --warn: var(--postit); --code: var(--niebla); --listo-bg: #000; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0B0A1F; --surface: #13112E; --surface-2: #1C1946; --fg: #E9E7F7; --muted: #A7A3C4; --line: #2A2752; --warn: var(--postit); --code: var(--niebla); --listo-bg: #000; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--display); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--menta); outline-offset: 2px; }
/* Selects con la tipografía de la marca, también en la lista desplegable (Chrome/Edge). */
select, ::picker(select) { appearance: base-select; }
select { font-family: var(--display); display: inline-flex; align-items: center; justify-content: space-between; }
::picker(select) { font-family: var(--display); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 12px 32px rgb(14 11 42 / .18); }
select option { font-family: var(--display); padding: 8px 10px; border-radius: 6px; }
select option:hover, select option:focus-visible { background: var(--surface-2); }
select option:checked { background: var(--indigo); color: #fff; }
select option::checkmark { display: none; }
select::picker-icon { color: var(--muted); }

header { background: var(--tinta); color: #F5F3FF; display: flex; align-items: center; gap: 14px; padding: 14px 24px; }
header img { width: 34px; height: 34px; }
.marca { font-weight: 800; font-size: 1.45rem; letter-spacing: -0.045em; }
.marca .cur { display: inline-block; width: .55em; height: .12em; background: var(--menta); margin-left: 2px; vertical-align: baseline; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .marca .cur { animation: none; } }
header .sub { font-family: var(--mono); font-size: .75rem; color: var(--niebla); opacity: .8; }
header .spacer { flex: 1; }
header .hora { font-family: var(--mono); font-size: .72rem; color: var(--niebla); opacity: .75; }
.btn { border: 0; border-radius: 10px; height: 40px; padding: 0 16px; cursor: pointer; font-weight: 700; }
.btn-primary { background: var(--indigo); color: #fff; }
.btn-primary:hover { background: var(--indigo-2); }
.btn-ghost { background: transparent; border: 1px solid var(--line); }
.btn-danger { background: var(--coral); color: var(--tinta); }
.icono { width: 40px; padding: 0; display: grid; place-items: center; background: transparent; color: #F5F3FF; border: 1px solid rgba(220,216,255,.35); }
.icono:hover { border-color: var(--menta); }
.icono svg { width: 18px; height: 18px; }
.girando svg { animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

.resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 20px 24px 8px; }
.kpi { background: var(--indigo); color: #fff; border-radius: 14px; padding: 14px 16px; position: relative; overflow: hidden; }
.kpi .n { font-weight: 800; font-size: 2rem; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.kpi .l { font-family: var(--mono); font-size: .72rem; opacity: .85; margin-top: 6px; }
.kpi.alerta { background: var(--tinta); }
.kpi.alerta::after { content: ""; position: absolute; right: -18px; top: -18px; width: 64px; height: 64px; border-radius: 50%; background: var(--coral); }
.kpi.duda::after { content: ""; position: absolute; right: -18px; top: -18px; width: 64px; height: 64px; border-radius: 50%; background: var(--postit); }

.proyectos { display: flex; gap: 10px; overflow-x: auto; padding: 8px 24px 4px; }
.repo { flex: 0 0 auto; min-width: 210px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 4px; }
.repo[aria-pressed="true"] { border-color: var(--indigo); box-shadow: inset 0 -3px 0 var(--indigo); }
.repo .n { font-weight: 800; letter-spacing: -0.02em; }
.repo .d { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.repo .warn { color: var(--warn); }

.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 24px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; border-radius: 8px; height: 32px; padding: 0 12px; cursor: pointer; font-weight: 700; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--indigo); color: #fff; }
.filtros select, .filtros input { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; }
.busqueda { padding: 0 24px 12px; }
.busqueda input { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; }
/* Filtros multiselección: <details> nativo con casillas; abre uno a la vez. */
.multi { display: flex; flex-wrap: wrap; gap: 8px; }
.ms { position: relative; }
.ms summary { list-style: none; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
.ms summary::-webkit-details-marker { display: none; }
.ms summary::after { content: "▾"; color: var(--muted); font-size: .8rem; }
.ms[open] summary, .ms.activo summary { border-color: var(--indigo); }
.ms .n { font-family: var(--mono); font-size: .7rem; background: var(--indigo); color: #fff; border-radius: 999px; padding: 0 7px; }
.ms .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; min-width: 220px; max-height: 320px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgb(14 11 42 / .18); display: grid; gap: 2px; }
.ms label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.ms label:hover { background: var(--surface-2); }
.ms input { accent-color: var(--indigo); width: 16px; height: 16px; }
.limpiar { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: .75rem; text-decoration: underline; height: 40px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; padding: 4px 24px 32px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
/* La lista tiene su propio scroll, como la ficha: el resumen, los repos y los filtros se quedan arriba. */
.lista { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 4px; }
.grupo { font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 10px 2px 2px; display: flex; gap: 8px; align-items: center; border: 0; background: transparent; padding: 4px 2px; cursor: pointer; text-align: left; }
.grupo:hover { color: var(--fg); }
.grupo .flecha { width: 12px; }
.ver-mas { border: 1px dashed var(--line); background: transparent; border-radius: 10px; padding: 8px; cursor: pointer; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.ver-mas:hover { border-color: var(--indigo); color: var(--fg); }
.grupo:first-child { margin-top: 0; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 6px; text-align: left; width: 100%; }
.item:hover { border-color: var(--indigo); }
.item[aria-current="true"] { border-color: var(--indigo); box-shadow: inset 4px 0 0 var(--indigo); }
.item .t { font-weight: 700; }
.item .num { font-family: var(--mono); font-size: .75rem; font-weight: 700; color: var(--indigo); background: var(--surface-2); border-radius: 6px; padding: 1px 6px; margin-right: 8px; vertical-align: 1px; }
:root[data-theme="dark"] .item .num { color: var(--niebla); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .item .num { color: var(--niebla); } }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.chip { border-radius: 999px; padding: 2px 8px; background: var(--surface-2); color: var(--fg); font-family: var(--mono); font-size: .72rem; white-space: nowrap; }
.e-pendiente { background: var(--surface-2); }
.e-en-curso { background: var(--indigo); color: #fff; }
.e-en-pruebas { background: var(--menta); color: var(--tinta); }
.e-bloqueado { background: var(--coral); color: var(--tinta); }
.e-listo { background: var(--listo-bg); color: var(--menta); }
.sev-critica, .sev-alta { background: var(--coral); color: var(--tinta); }
.sev-media { background: var(--postit); color: var(--tinta); }
.amb { display: inline-flex; gap: 2px; }
.amb span { font-family: var(--mono); font-size: .65rem; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.amb span.on { background: var(--indigo); border-color: var(--indigo); color: #fff; }
.amb .git { border: 0; padding-left: 2px; font-size: .62rem; }
.vacio { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); }

.ficha { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; position: sticky; top: 16px; display: grid; gap: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
.ficha h2 { margin: 0; font-weight: 800; letter-spacing: -0.03em; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
label.f { min-width: 0; display: grid; gap: 4px; font-family: var(--mono); font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
label.f input, label.f select, label.f textarea { width: 100%; min-width: 0; font-family: var(--display); font-size: .95rem; text-transform: none; letter-spacing: 0; color: var(--fg); border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; }
label.f input, label.f select { height: 40px; padding-block: 0; }
label.f textarea { min-height: 72px; resize: vertical; }
.bloque { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.bloque h3 { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.duda-box textarea { background: color-mix(in srgb, var(--postit) 22%, var(--bg)); }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.toggles button { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; cursor: pointer; font-family: var(--mono); font-weight: 700; }
.toggles button[aria-pressed="true"] { background: var(--indigo); border-color: var(--indigo); color: #fff; }
.toggles button:disabled { cursor: default; }
.prueba { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--bg); border-radius: 10px; padding: 6px 6px 6px 12px; }
.prueba .acc { display: flex; gap: 4px; }
.prueba .acc button { height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; padding: 0 10px; font-family: var(--mono); font-size: .75rem; }
.prueba .acc button.ok[aria-pressed="true"] { background: var(--menta); border-color: var(--menta); color: var(--tinta); }
.prueba .acc button.falla[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: var(--tinta); }
.fila { display: flex; gap: 8px; }
.fila input, .fila select { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 10px; }
.commit { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.commit code { font-family: var(--mono); font-size: .78rem; color: var(--code); }
.commit .s { min-width: 0; }
.commit .s div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.commit .err { color: var(--coral); }
.commit button { height: 30px; width: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.avance { display: grid; gap: 2px; border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.avance.claude { border-left-color: var(--menta); }
.avance .q { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.ptabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.ptabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.ptabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--indigo); }
.ptabs .c { font-family: var(--mono); font-size: .68rem; background: var(--surface-2); border-radius: 999px; padding: 0 6px; color: var(--muted); }
.md h3, .md h4, .md h5 { margin: 1em 0 .4em; }
.md p, .md ul { margin: .4em 0; line-height: 1.5; }
.md ul { padding-left: 1.2em; }
.md table { border-collapse: collapse; width: 100%; font-size: .85rem; margin: .5em 0; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); }
.md pre { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-size: .8rem; }
.ptabs .c.duda { background: var(--postit); color: var(--tinta); }
.pbody { display: grid; gap: 12px; }
.pbody > .bloque:first-child { border-top: 0; padding-top: 0; }
/* Carga inicial: esqueletos con la forma de lo que viene, hasta que responde el servidor. */
.skel { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: brillo 1.2s ease-in-out infinite; border-radius: 12px; }
@keyframes brillo { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.skel.kpi-s { height: 82px; border-radius: 14px; }
.skel.repo-s { flex: 0 0 210px; height: 66px; }
.skel.item-s { height: 64px; }
.skel.ficha-s { height: 420px; border-radius: 16px; }
.cargando-txt { font-family: var(--mono); font-size: .75rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.cargando-txt::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--menta); animation: blink 1.1s steps(1) infinite; }
.acciones { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.aviso { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.error { color: var(--coral); font-family: var(--mono); font-size: .8rem; }
</style>
</head>
<body>
<header>
  <img src="/icon.svg" alt="">
  <div>
    <div class="marca">alcance<span class="cur"></span></div>
    <div class="sub">requerimientos · QA · pentest</div>
  </div>
  <div class="spacer"></div>
  <span class="hora" id="hora"></span>
  <button class="btn icono" id="refrescar" aria-label="Actualizar ahora" title="Actualizar ahora (relee git)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
  <button class="btn icono" id="tema" aria-label="Cambiar a modo oscuro"></button>
  <button class="btn btn-primary" id="nuevo">Nuevo</button>
</header>

<section class="resumen" id="resumen" aria-busy="true"><div class="skel kpi-s"></div><div class="skel kpi-s"></div><div class="skel kpi-s"></div><div class="skel kpi-s"></div><div class="skel kpi-s"></div></section>
<section class="proyectos" id="proyectos" aria-label="Proyectos locales"><div class="skel repo-s"></div><div class="skel repo-s"></div><div class="skel repo-s"></div><div class="skel repo-s"></div><div class="skel repo-s"></div></section>

<section class="filtros">
  <div class="tabs" id="tabs" role="group" aria-label="Tipo"></div>
  <div class="multi" id="multi"></div>
  <button class="limpiar" id="limpiar" hidden>Limpiar filtros</button>
</section>
<section class="busqueda">
  <input id="f-q" type="search" placeholder="Buscar por título, alcance o dudas" aria-label="Buscar">
</section>

<main>
  <div class="lista" id="lista" aria-busy="true"><div class="cargando-txt">Cargando tickets y leyendo git…</div><div class="skel item-s"></div><div class="skel item-s"></div><div class="skel item-s"></div><div class="skel item-s"></div><div class="skel item-s"></div><div class="skel item-s"></div></div>
  <aside class="ficha" id="ficha"><div class="skel ficha-s"></div></aside>
</main>

<script>
// ---------- Tema ----------
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const LUNA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const temaActual = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function pintarTema() {
  const oscuro = temaActual() === "dark", b = document.getElementById("tema");
  b.innerHTML = oscuro ? SOL : LUNA;
  b.setAttribute("aria-label", oscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
}
try { const t = localStorage.getItem("alcance-tema"); if (t) document.documentElement.dataset.theme = t; } catch {}
pintarTema();
document.getElementById("tema").addEventListener("click", () => {
  const t = temaActual() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("alcance-tema", t); } catch {}
  pintarTema();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", pintarTema);

// ---------- Estado ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ETIQUETA = { pendiente: "pendiente", "en-curso": "en curso", "en-pruebas": "en pruebas", bloqueado: "bloqueado", listo: "listo" };
const TIPO = { todos: "Todo", requerimiento: "Requerimientos", tarea: "Tareas", bug: "Bugs", pentest: "Pentest", historico: "Histórico" };
// Filtros multiselección: dentro de un filtro es "o", entre filtros es "y".
const AMB_OPC = [["qa-sin-prod", "En QA, falta prod"], ["dev", "Ya en DEV"], ["qa", "Ya en QA"], ["uat", "Ya en UAT"], ["prod", "Ya en PROD"], ["ninguno", "Sin desplegar"]];
const elegidos = { estado: new Set(), sistema: new Set(), prioridad: new Set(), amb: new Set() };
let filtroAbierto = null;
const ORDEN = ["en-curso", "bloqueado", "en-pruebas", "pendiente", "listo"];
let meta, items = [], repos = [], repoSel = "", sel = null, tipo = "todos", borrador = null, sucio = false, confirmarBorrar = false;
let commitRepo = "", commitOpciones = [], pestana = "detalle";
// Detalle completo del ticket abierto (avances, historial, commits); la lista solo trae el resumen.
// Grupos plegados (se recuerdan en este navegador) y grupos con "ver más" abierto.
const POR_GRUPO = 5;
let plegados = new Set(), expandidos = new Set();
try { plegados = new Set(JSON.parse(localStorage.getItem("alcance-plegados") || "[]")); } catch {}
let detalleItem = null, cerrados = [], hayMas = false, desde = "", huella = "", totalCerrados = 0;
const diasAtras = (n, base = new Date()) => { const d = new Date(base); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };

const api = async (path, opts = {}) => {
  const r = await fetch(path, { headers: { "content-type": "application/json" }, ...opts, body: opts.body && JSON.stringify(opts.body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "No se pudo guardar. Revisá que el servidor siga corriendo.");
  return data;
};

async function cargarHistorico() {
  if (!desde) desde = diasAtras(30);
  const q = $("#f-q").value.trim();
  const r = await api(`/api/items?vista=historico&desde=${desde}${q ? `&q=${encodeURIComponent(q)}` : ""}`);
  cerrados = r.items; hayMas = r.hayMas;
}
async function recargarDetalle() {
  if (!borrador?.id) return;
  detalleItem = await api(`/api/items/${borrador.id}`);
  // Ficha abierta sin cambios: se refresca con lo último (por ejemplo, lo que anotó Claude).
  if (!sucio) borrador = structuredClone(detalleItem);
}
async function cargar(fresco = false) {
  const f = fresco ? "?fresco=1" : "";
  const [ab, rp, ver] = await Promise.all([api(`/api/items${f}`), api(`/api/repos${f}`), api("/api/version")]);
  items = ab; repos = rp; huella = ver.huella; totalCerrados = ver.cerrados;
  await Promise.all([tipo === "historico" ? cargarHistorico() : null, recargarDetalle()]);
  $("#hora").textContent = `al día ${new Date().toLocaleTimeString("es-SV", { hour: "2-digit", minute: "2-digit" })}`;
  render();
}

function filtrados() {
  const q = $("#f-q").value.trim().toLowerCase();
  const { estado, sistema, prioridad, amb } = elegidos;
  // Ambiente calculado de git si hay commits; si no, el marcado a mano.
  const cumpleAmb = (a, f) => f === "ninguno" ? !Object.values(a).some(Boolean) : f === "qa-sin-prod" ? a.qa && !a.prod : !!a[f];
  const enAmb = (i) => !amb.size || [...amb].some((f) => cumpleAmb(i.ambientesGit ?? i.ambientes, f));
  // Histórico = solo los terminados; el resto de pestañas esconde lo terminado salvo que filtres por "listo".
  const historico = tipo === "historico";
  return (historico ? cerrados : items).filter((i) =>
    (historico || tipo === "todos" || i.tipo === tipo) &&
    (!estado.size || estado.has(i.estado)) && (!sistema.size || sistema.has(i.sistema)) && (!prioridad.size || prioridad.has(i.prioridad)) && enAmb(i) &&
    (!repoSel || i.sistema === repoSel || i.commitRepos.includes(repoSel)) &&
    (!q || [i.titulo, i.incluye, i.excluye, i.dudas].join(" ").toLowerCase().includes(q)));
}

// ---------- Render ----------
function render() {
  const abiertos = items.filter((i) => i.estado !== "listo");
  const kpis = [
    [abiertos.length, "abiertos"],
    [abiertos.filter((i) => i.estado === "en-curso").length, "en curso"],
    [abiertos.filter((i) => i.dudas.trim()).length, "con dudas para la PM", "duda"],
    [abiertos.reduce((n, i) => n + i.pruebas.filter((p) => p.resultado !== "ok").length, 0), "pruebas QA sin pasar"],
    [abiertos.filter((i) => i.tipo === "pentest").length, "hallazgos de pentest abiertos", "alerta"],
  ];
  $("#resumen").removeAttribute("aria-busy"); $("#lista").removeAttribute("aria-busy");
  $("#resumen").innerHTML = kpis.map(([n, l, c]) => `<div class="kpi ${c || ""}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

  $("#proyectos").innerHTML = repos.map((r) => {
    const falta = Object.entries(r.pendientes).filter(([, n]) => n > 0).map(([a, n]) => `${n} por ${a}`).join(" · ");
    return `<button class="repo" data-repo="${esc(r.nombre)}" aria-pressed="${repoSel === r.nombre}">
      <span class="n">${esc(r.nombre)}</span>
      <span class="d">${esc(r.rama)}${r.sinCommit ? ` · <span class="warn">${r.sinCommit} sin commit</span>` : ""}${r.sinPush ? ` · <span class="warn">${r.sinPush} sin push</span>` : ""}</span>
      <span class="d">${falta ? `develop: ${falta}` : "develop al día en todos"}</span>
    </button>`;
  }).join("");

  $("#tabs").innerHTML = Object.entries(TIPO).map(([k, v]) => `<button data-tipo="${k}" aria-pressed="${k === tipo}">${v}</button>`).join("");
  const sistemas = [...new Set([...items, ...cerrados].map((i) => i.sistema).filter(Boolean))].sort();
  const filtros = [
    ["estado", "Estado", meta.ESTADOS.map((x) => [x, ETIQUETA[x]])],
    ["sistema", "Sistema", sistemas.map((x) => [x, x])],
    ["prioridad", "Prioridad", meta.PRIORIDADES.map((x) => [x, x])],
    ["amb", "Ambiente", AMB_OPC],
  ];
  $("#multi").innerHTML = filtros.map(([k, t, opts]) => `
    <details class="ms ${elegidos[k].size ? "activo" : ""}" data-filtro="${k}" ${filtroAbierto === k ? "open" : ""}>
      <summary>${t}${elegidos[k].size ? `<span class="n">${elegidos[k].size}</span>` : ""}</summary>
      <div class="menu">${opts.map(([v, l]) => `<label><input type="checkbox" data-f="${k}" value="${esc(v)}" ${elegidos[k].has(v) ? "checked" : ""}>${esc(l)}</label>`).join("") || `<span class="aviso">Sin opciones</span>`}</div>
    </details>`).join("");
  $("#limpiar").hidden = !Object.values(elegidos).some((x) => x.size);

  // Agrupado por proyecto (en curso primero); en el Histórico, por fecha de cierre.
  const historico = tipo === "historico";
  const lista = filtrados().sort((a, b) => historico
    ? String(b.cerrado).localeCompare(String(a.cerrado))
    : a.sistema.localeCompare(b.sistema) || ORDEN.indexOf(a.estado) - ORDEN.indexOf(b.estado));
  const grupoDe = (x) => historico ? String(x.cerrado).slice(0, 10) : x.sistema || "sin proyecto";
  const grupos = new Map();
  for (const i of lista) {
    const g = grupoDe(i);
    if (!grupos.has(g)) grupos.set(g, []);
    grupos.get(g).push(i);
  }
  // Con búsqueda o filtro de estado se muestra todo lo que coincide; sin filtros, 5 por grupo.
  const filtrando = !!($("#f-q").value.trim() || Object.values(elegidos).some((x) => x.size));
  const tarjeta = (i) => {
    const amb = i.ambientesGit ?? i.ambientes;
    return `
    <button class="item" data-id="${i.id}" aria-current="${sel === i.id}">
      <div class="t"><span class="num">#${i.id}</span>${esc(i.titulo)}</div>
      <div class="meta">
        <span class="chip e-${i.estado}">${ETIQUETA[i.estado]}</span>
        <span class="chip">${i.tipo}</span>
        ${i.severidad ? `<span class="chip sev-${i.severidad}">sev. ${i.severidad}</span>` : ""}
        ${i.prioridad === "alta" ? `<span class="chip sev-alta">prioridad alta</span>` : ""}
        ${i.sistema ? `<span>${esc(i.sistema)}</span>` : ""}
        <span class="amb">${meta.AMBIENTES.map((a) => `<span class="${amb[a] ? "on" : ""}">${a}</span>`).join("")}${i.ambientesGit ? `<span class="git">git</span>` : ""}</span>
        ${i.dudas.trim() && i.estado !== "listo" ? `<span class="chip sev-media">duda PM</span>` : ""}
        ${i.pruebas.length ? `<span>QA ${i.pruebas.filter((p) => p.resultado === "ok").length}/${i.pruebas.length}</span>` : ""}
        ${i.totalCommits ? `<span>${i.totalCommits} commit${i.totalCommits > 1 ? "s" : ""}</span>` : ""}
        ${historico ? `<span>cerrado ${esc(String(i.cerrado).slice(5, 16))}</span>` : ""}
      </div>
    </button>`;
  };
  const scroll = $("#lista").scrollTop;
  $("#lista").innerHTML = lista.length ? [...grupos].map(([g, its]) => {
    const plegado = plegados.has(g) && !filtrando;
    const visibles = filtrando || expandidos.has(g) ? its : its.slice(0, POR_GRUPO);
    const resto = its.length - visibles.length;
    return `<button class="grupo" data-grupo="${esc(g)}" aria-expanded="${!plegado}">
        <span class="flecha">${plegado ? "▸" : "▾"}</span>
        <span>${historico ? `cerrados el ${esc(g.split("-").reverse().join("/"))}` : esc(g)}</span><span>${its.length}</span>
      </button>
      ${plegado ? "" : visibles.map(tarjeta).join("") + (resto > 0 ? `<button class="ver-mas" data-ver-mas="${esc(g)}">ver ${resto} más de ${esc(g)}</button>` : "")}`;
  }).join("")
    : `<div class="vacio">${historico ? "No hay tickets cerrados en este rango." : items.length ? "Nada coincide con los filtros." : "Todavía no hay nada. Creá el primer requerimiento con «Nuevo» o pedíselo a Claude en la sesión."}</div>`;
  $("#lista").scrollTop = scroll;
  if (historico && hayMas) {
    $("#lista").insertAdjacentHTML("beforeend", `<button class="btn btn-ghost" id="mas">Cargar más (cerrados antes del ${esc(desde.split("-").reverse().join("/"))})</button>`);
  }
  if (historico) $("#lista").insertAdjacentHTML("afterbegin", `<div class="aviso">${lista.length} de ${totalCerrados} cerrados${$("#f-q").value.trim() ? " · búsqueda en todo el histórico" : ` · desde el ${esc(desde.split("-").reverse().join("/"))}`}</div>`);

  renderFicha();
}

      <h3>Dónde está</h3>

        ? `<div class="toggles">${meta.AMBIENTES.map((a) => `<button disabled aria-pressed="${!!b.ambientesGit[a]}" title="Calculado de git">${a.toUpperCase()}</button>`).join("")}</div>
           <div class="aviso">Calculado de git: un ambiente se marca cuando todos los commits del ticket ya llegaron a esa rama. Para marcarlo a mano, quitá los commits.</div>`

    <div class="acciones">

// Markdown mínimo para la pestaña Análisis (lo escribe Claude por CLI): títulos, listas, tablas,
// **negrita**, `código` y bloques ```. Todo pasa por esc() antes de formatear.
function markdown(src) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const out = [];
  const lineas = src.replace(/\r/g, "").split("\n");
  for (let i = 0; i < lineas.length; i++) {
    const l = lineas[i];
    if (l.startsWith("```")) {
      const code = [];
      while (++i < lineas.length && !lineas[i].startsWith("```")) code.push(lineas[i]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
    } else if (/^#{1,4} /.test(l)) {
      const n = Math.min(l.indexOf(" ") + 2, 5);
      out.push(`<h${n}>${inline(l.slice(l.indexOf(" ") + 1))}</h${n}>`);
    } else if (l.trim().startsWith("|")) {
      const filas = [];
      for (; i < lineas.length && lineas[i].trim().startsWith("|"); i++) filas.push(lineas[i]);
      i--;
      const celdas = (f) => f.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const cuerpo = filas.filter((f) => !/^\s*\|[\s:|-]+\|\s*$/.test(f));
      out.push(`<table>${cuerpo.map((f, k) => `<tr>${celdas(f).map((c) => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^\s*[-*] /.test(l)) {
      const items = [];
      for (; i < lineas.length && /^\s*[-*] /.test(lineas[i]); i++) items.push(`<li>${inline(lineas[i].replace(/^\s*[-*] /, ""))}</li>`);
      i--;
      out.push(`<ul>${items.join("")}</ul>`);
    } else if (l.trim()) {
      out.push(`<p>${inline(l)}</p>`);
    }
  }
  return out.join("");
}

// ---------- Interacción ----------
function leerForm() {
  for (const k of ["titulo", "tipo", "sistema", "estado", "prioridad", "severidad", "incluye", "excluye", "dudas"]) {
    const el = $(`#c-${k}`);
    if (el) borrador[k] = el.value;
  }
}
function cargarCommits() {
  commitOpciones = [];
  if (commitRepo) api(`/api/repos/${encodeURIComponent(commitRepo)}/commits`).then((r) => { commitOpciones = r; renderFicha(); });
}
async function abrir(id) {
  sel = id; sucio = false; confirmarBorrar = false; pestana = "detalle";
  detalleItem = await api(`/api/items/${id}`);
  const i = detalleItem;
  borrador = structuredClone(i);
  // La ficha arranca con el repo que tengas filtrado arriba.
  commitRepo = repoSel || i.commits[0]?.repo || "";
  cargarCommits();
  render();
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  try {
    if (t.id === "refrescar") {
      t.classList.add("girando");
      try { await cargar(true); } finally { t.classList.remove("girando"); }
      return;
    }
    if (t.id === "limpiar") { Object.values(elegidos).forEach((x) => x.clear()); return render(); }
    if (t.dataset.tipo) {
      tipo = t.dataset.tipo;
      if (tipo === "historico") { desde = ""; await cargarHistorico(); }
      return render();
    }
    if (t.dataset.grupo !== undefined) {
      const g = t.dataset.grupo;
      plegados.has(g) ? plegados.delete(g) : plegados.add(g);
      try { localStorage.setItem("alcance-plegados", JSON.stringify([...plegados])); } catch {}
      return render();
    }
    if (t.dataset.verMas !== undefined) {
      const g = t.dataset.verMas;
      expandidos.has(g) ? expandidos.delete(g) : expandidos.add(g);
      return render();
    }
    if (t.id === "mas") { desde = diasAtras(30, new Date(desde)); await cargarHistorico(); return render(); }
    if (t.dataset.repo) { repoSel = repoSel === t.dataset.repo ? "" : t.dataset.repo; return render(); }
    if (t.dataset.id) return abrir(Number(t.dataset.id));
    if (t.id === "nuevo") {
      sel = null; sucio = false; confirmarBorrar = false; detalleItem = null;
      borrador = { tipo: ["todos", "historico"].includes(tipo) ? "requerimiento" : tipo, titulo: "", sistema: repoSel, estado: "pendiente", prioridad: "media", severidad: "", incluye: "", excluye: "", dudas: "", ambientes: {}, pruebas: [] };
      return render();
    }
    if (!borrador) return;
    leerForm();
    if (t.dataset.pestana) { pestana = t.dataset.pestana; return renderFicha(); }
    if (t.dataset.amb) { borrador.ambientes[t.dataset.amb] = !borrador.ambientes[t.dataset.amb]; sucio = true; return renderFicha(); }
    if (t.dataset.prueba) { const p = borrador.pruebas[+t.dataset.prueba]; p.resultado = p.resultado === t.dataset.r ? null : t.dataset.r; sucio = true; return renderFicha(); }
    if (t.dataset.quitar) { borrador.pruebas.splice(+t.dataset.quitar, 1); sucio = true; return renderFicha(); }
    if (t.id === "add-caso") {
      const v = $("#c-caso").value.trim();
      if (!v) return;
      borrador.pruebas.push({ caso: v, resultado: null }); sucio = true; return renderFicha();
    }
    if (t.dataset.quitarCommit) {
      const [repo, sha] = t.dataset.quitarCommit.split("|");
      await api(`/api/items/${borrador.id}/commits`, { method: "DELETE", body: { repo, sha } });
      return cargar();
    }
    if (t.id === "add-commit") {
      const sha = $("#c-sha").value;
      if (!commitRepo || !sha) return;
      await api(`/api/items/${borrador.id}/commits`, { method: "POST", body: { repo: commitRepo, sha } });
      return cargar();
    }
    if (t.id === "add-avance") {
      const v = $("#c-avance").value.trim();
      if (!v) return;
      await api(`/api/items/${borrador.id}/avances`, { method: "POST", body: { texto: v } });
      return cargar();
    }
    if (t.id === "guardar") {
      const { id, creado, actualizado, avances, commits, historial, ambientesGit, cerrado, ...datos } = borrador;
      const r = id ? await api(`/api/items/${id}`, { method: "PATCH", body: datos }) : await api("/api/items", { method: "POST", body: datos });
      sucio = false; sel = r.id; borrador = { ...borrador, id: r.id };
      if (!id) detalleItem = await api(`/api/items/${r.id}`);
      return cargar();
    }
    if (t.id === "cerrar") { borrador = null; detalleItem = null; sel = null; sucio = false; return render(); }
    if (t.id === "borrar") { confirmarBorrar = true; return renderFicha(); }
    if (t.id === "borrar-no") { confirmarBorrar = false; return renderFicha(); }
    if (t.id === "borrar-si") {
      await api(`/api/items/${borrador.id}`, { method: "DELETE" });
      borrador = null; detalleItem = null; sel = null; confirmarBorrar = false;
      return cargar();
    }
  } catch (err) {
    const box = $("#err");
    if (box) box.textContent = err.message;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.closest("#ficha") && !["c-caso", "c-avance"].includes(e.target.id)) sucio = true;
  if (e.target.id === "f-q") {
    if (tipo !== "historico") return render();
    clearTimeout(window.buscando);
    window.buscando = setTimeout(() => cargarHistorico().then(render), 300);
  }
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.f) {
    const set = elegidos[e.target.dataset.f];
    e.target.checked ? set.add(e.target.value) : set.delete(e.target.value);
    filtroAbierto = e.target.dataset.f;
    render();
  }
  if (e.target.id === "c-tipo") { leerForm(); renderFicha(); }
  if (e.target.id === "c-repo") { leerForm(); commitRepo = e.target.value; cargarCommits(); renderFicha(); }
});

(async () => {
  try {
    meta = await api("/api/meta");
  } catch {
    $("#lista").innerHTML = `<div class="vacio">No se pudo conectar con el servidor de Alcance. Levantalo con <code>npm start</code> en Desktop/alcance y recargá.</div>`;
    return;
  }
  // Abre un filtro a la vez y lo cierra al hacer clic fuera.
  document.addEventListener("toggle", (e) => {
    if (!e.target.matches?.(".ms")) return;
    if (e.target.open) { filtroAbierto = e.target.dataset.filtro; document.querySelectorAll(".ms[open]").forEach((d) => d !== e.target && d.removeAttribute("open")); }
    else if (filtroAbierto === e.target.dataset.filtro) filtroAbierto = null;
  }, true);
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".ms")) { filtroAbierto = null; document.querySelectorAll(".ms[open]").forEach((d) => d.removeAttribute("open")); }
  });
  await cargar();
  // Lo que Claude anota desde el CLI aparece solo; no refresca mientras escribís o elegís algo.
  // Cada 5 s solo se pregunta la huella; si nada cambió, no se descarga nada.
  setInterval(async () => {
    if (sucio || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
    try { if ((await api("/api/version")).huella !== huella) await cargar(); } catch {}
  }, 5000);
})();
</script>
